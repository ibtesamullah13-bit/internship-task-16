<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My basic Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <h2> my  basic simple Calculator</h2>

        <input type="text" id="display" value="0"
            readonly aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" data-action="clear">C</button>
            <button class="operator" data-action="backspace">⌫</button>
            <button class="operator" data-operator="/">÷</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equal" data-action="equals">=</button>

            <button data-action="sign">±</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="clear" data-action="clear-entry">CE</button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
